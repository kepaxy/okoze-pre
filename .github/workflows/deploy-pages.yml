name: Deploy Episodes

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site

          for tag in episode-001 episode-002; do
            episode="${tag#episode-}"
            mkdir -p "_site/episode-${episode}"

            git archive "$tag" \
              index.html main.js style.css \
              | tar -x -C "_site/episode-${episode}"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
