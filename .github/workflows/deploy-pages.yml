name: Deploy Episodes

on:
  push:
    tags:
      - "episode-*"

  delete:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref_name: ${{ github.ref_name }}"

  deploy:
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'delete' &&
        github.event.ref_type == 'tag' &&
        startsWith(github.event.ref, 'episode-')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>okoze-pre Live Demo</title>
          </head>
          <body>
            <h1>okoze-pre Live Demo</h1>
            <h2>Episodes</h2>
            <ul>
          EOF

          for tag in $(git tag -l 'episode-*' --sort=version:refname); do
            episode="${tag#episode-}"
            echo "Deploying ${tag}"

            mkdir -p "_site/episode-${episode}"

            git archive "$tag" \
              index.html main.js style.css \
              | tar -x -C "_site/episode-${episode}"

            echo "              <li><a href=\"./episode-${episode}/\">Episode ${episode}</a></li>" \
              >> _site/index.html
          done

          cat >> _site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
