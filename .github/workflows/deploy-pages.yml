name: Deploy Episode

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Episode tag to deploy"
        required: true
        default: "episode-001"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          episode="${TAG#episode-}"
          mkdir -p "_site/episode-${episode}"
          cp index.html main.js style.css "_site/episode-${episode}/"
        env:
          TAG: ${{ inputs.tag }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
